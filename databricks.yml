bundle:
  name: rfp-presentation-sep26

include:
  - resources/*.yml

variables:
  catalog:
    default: main
    description: "Unity Catalog name (override with -v catalog=your_catalog)"
  schema:
    default: rfp_presentation
    description: "Schema for all DBX Bank RFP demo assets (override with -v schema=your_schema)"

workspace:
  # host is set via CLI profile — do not hardcode here.
  # Each user authenticates with their own workspace via:
  #   databricks auth login --host https://<your-workspace>.cloud.databricks.com
  #
  # root_path resolves automatically to:
  #   /Workspace/Users/<your-email>/rfp-presentation-sep26
  root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}

sync:
  include:
    - shared/**
    - part_a_customer_360/**
    - part_b_hyperpersonalization/**
  exclude:
    - "**/__pycache__/**"
    - "**/.venv/**"
    - part_a_customer_360/data/pdfs/**   # PDFs uploaded separately via CLI
    - part_b_hyperpersonalization/app/frontend/node_modules/**
    # dist/ is included so the app can serve the pre-built React frontend

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-fevm-master-classic-marcus.cloud.databricks.com
    variables:
      catalog: fevm_master_classic_marcus_catalog
      schema: rfp_presentation
