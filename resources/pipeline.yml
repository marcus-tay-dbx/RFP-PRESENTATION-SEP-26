resources:
  pipelines:
    dbx_pipeline:
      name: DBX-Customer-360-Pipeline
      serverless: true
      continuous: false         # triggered — run on-demand or scheduled
      catalog: ${var.catalog}
      schema: ${var.schema}
      libraries:
        # Bronze (batch CSV, AutoLoader inline) + Silver SCD2
        # Also reads RT bronze tables from Pipeline 1 (DBX-RT-Bronze) via UC
        - notebook:
            path: ${workspace.root_path}/files/part_a_customer_360/07_sdp_bronze_silver
        # Silver → Gold: assembles gold_customer_360 from all 7 silver tables
        - notebook:
            path: ${workspace.root_path}/files/part_a_customer_360/08_sdp_silver_gold
      channel: CURRENT
      development: true
