resources:
  jobs:
    dbx_setup_and_ingest:
      name: DBX-Part-A-Setup-and-Ingest
      description: "End-to-end Part A: setup → data gen → Customer 360 pipeline (triggered). Start DBX-Events-Generator + DBX-RT-Bronze separately for the streaming demo."

      tasks:
        - task_key: setup
          description: "Create UC schema, volumes, and all directory structure (including streaming/ dirs)"
          notebook_task:
            notebook_path: /Workspace/Users/marcus.tay@databricks.com/rfp-presentation-sep26/files/part_a_customer_360/00_setup
            source: WORKSPACE
          environment_key: serverless

        - task_key: generate_data
          description: "Generate 1,000 synthetic customers + all batch CSV/JSON source files"
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: /Workspace/Users/marcus.tay@databricks.com/rfp-presentation-sep26/files/part_a_customer_360/01_data_generator
            source: WORKSPACE
          environment_key: serverless

        - task_key: run_pipeline
          description: "Trigger DBX-Customer-360-Pipeline: batch bronze AutoLoader → silver SCD2 → gold_customer_360"
          depends_on:
            - task_key: generate_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.dbx_pipeline.id}

      # Daily refresh at 01:00 AM Kuala Lumpur time
      schedule:
        quartz_cron_expression: "0 0 1 * * ?"
        timezone_id: "Asia/Kuala_Lumpur"
        pause_status: UNPAUSED

      environments:
        - environment_key: serverless
          spec:
            client: "1"
