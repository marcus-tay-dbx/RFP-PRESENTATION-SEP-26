resources:
  jobs:
    dbx_part_b_training:
      name: DBX-Part-B-Training-Pipeline
      description: "Feature engineering → RF+XGBoost training → endpoint deploy → batch inference"

      tasks:
        - task_key: feature_engineering
          description: "Build customer_features table from gold_customer_360 + label assignment"
          notebook_task:
            notebook_path: ${workspace.root_path}/files/part_b_hyperpersonalization/03-Feature-Engineering
            source: WORKSPACE
          environment_key: serverless_ml

        - task_key: model_training
          description: "Train RF + XGBoost, compete by macro F1, register winner as @dev"
          depends_on:
            - task_key: feature_engineering
          notebook_task:
            notebook_path: ${workspace.root_path}/files/part_b_hyperpersonalization/04-Model-Training
            source: WORKSPACE
          environment_key: serverless_ml

        - task_key: realtime_endpoint
          description: "Promote @dev → @champion, deploy/update serving endpoint with AI Gateway logging"
          depends_on:
            - task_key: model_training
          notebook_task:
            notebook_path: ${workspace.root_path}/files/part_b_hyperpersonalization/06-Real-Time-Inference
            source: WORKSPACE
          environment_key: serverless_ml

        - task_key: batch_inference
          description: "fe.score_batch all customers → product_recommendation_inference_log + InferenceLog monitor"
          depends_on:
            - task_key: realtime_endpoint
          notebook_task:
            notebook_path: ${workspace.root_path}/files/part_b_hyperpersonalization/05-Batch-Inference
            source: WORKSPACE
          environment_key: serverless_ml

      environments:
        - environment_key: serverless_ml
          spec:
            client: "1"
